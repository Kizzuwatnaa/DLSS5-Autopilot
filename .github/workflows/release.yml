# Builds the released executable on GitHub's own runners, from the source in
# this repository, and publishes it with a signed provenance attestation.
#
# The point is that nobody has to take anyone's word for what is in the .exe.
# The build happens in public, the log is public, and the attestation ties the
# published binary to this exact commit. If the file someone downloads does
# not match the hash in the release notes, it did not come from here.
#
# About antivirus: PyInstaller's stock bootloader is the part heuristic
# scanners have learned to distrust, because plenty of real malware ships in
# the same wrapper. Building PyInstaller from source compiles a fresh
# bootloader on this runner - byte-for-byte different from the one every
# scanner has a signature for - which removes most of the false positives.
# It cannot remove SmartScreen's "unknown publisher" prompt, and it cannot
# stop Defender's cloud heuristics from deleting a brand-new, never-seen
# file in its first hours (issue #5): only a code-signing certificate does
# that, because reputation then follows the certificate across releases.
# The SignPath Foundation signs open-source builds for free; the signing
# step below runs as soon as the repository carries the SignPath variables
# (SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
# SIGNPATH_SIGNING_POLICY_SLUG) and the SIGNPATH_API_TOKEN secret, and is
# skipped - build unchanged - until then. SignPath itself verifies that the
# file came out of this workflow on a GitHub-hosted runner before signing.
#
# Layout: --onefile today. A one-folder build (exe + _internal) is what the
# heuristics react to least, and the updater understands it since 1.7.0 -
# but every copy older than 1.7.0 fetches only the exe out of the release
# zip, so the switch waits until those copies have moved on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets a build be run by hand, without a tag

permissions:
  contents: write             # create the release and upload to it
  id-token: write             # sign the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From source, so the bootloader is compiled here rather than taken
      # from the wheel every scanner has seen. Falls back to the wheel if the
      # runner cannot compile it - the build must not fail over this.
      - name: Install PyInstaller (fresh bootloader)
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # The root-certificate bundle the exe carries (net.ssl_context).
          python -m pip install --upgrade certifi
          if python -m pip install --no-binary pyinstaller --no-cache-dir pyinstaller; then
            echo "BOOTLOADER=compiled on this runner" >> "$GITHUB_ENV"
          else
            echo "::warning::could not build PyInstaller from source; using the wheel"
            python -m pip install pyinstaller
            echo "BOOTLOADER=stock wheel" >> "$GITHUB_ENV"
          fi
          python -m PyInstaller --version

      # The tool has no third-party dependencies - standard library and
      # tkinter only - so there is nothing else to install, and nothing from
      # PyPI ends up inside the executable.
      - name: Check there are no third-party imports
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            echo "requirements.txt exists - review it before trusting this build"
            cat requirements.txt
          else
            echo "no requirements.txt: standard library only"
          fi
          if grep -rEn "^(import|from) (requests|numpy|PIL|psutil|pefile)\b" core dlss5_autopilot.py; then
            echo "third-party import found"; exit 1
          fi

      - name: Tests that need no network
        shell: bash
        run: |
          python test_reshade_ini.py
          python -m unittest -v test_scan

      - name: Build
        run: |
          python -m PyInstaller --onefile --windowed --noupx `
            --name dlss5-autopilot `
            --version-file version_info.txt `
            --icon dlss5-autopilot.ico `
            --distpath dist `
            --noconfirm `
            dlss5_autopilot.py

      # ---- code signing (SignPath Foundation), when the repository is set up
      - name: Upload the unsigned executable for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executable
          path: dist/dlss5-autopilot.exe
          if-no-files-found: error

      - name: Sign the executable
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed executable
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          SIGNED="$(find signed -name 'dlss5-autopilot.exe' | head -1)"
          test -n "$SIGNED" || { echo "::error::signed executable not returned"; exit 1; }
          cp "$SIGNED" dist/dlss5-autopilot.exe
          echo "SIGNED=SignPath Foundation certificate" >> "$GITHUB_ENV"
          echo "signed: $SIGNED"

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          mkdir -p out
          cp dist/dlss5-autopilot.exe out/
          cp README.md LICENSE NOTICE out/
          cd out
          7z a "../DLSS5-Autopilot-v${VERSION}-win64.zip" ./*
          cd ..
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Hashes
        shell: bash
        run: |
          sha256sum dist/dlss5-autopilot.exe \
                    "DLSS5-Autopilot-v${VERSION}-win64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '### SHA-256'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "bootloader: $BOOTLOADER"
            echo "signature: ${SIGNED:-none (SignPath not configured)}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Ties the binary to this commit and this workflow run, verifiable with
      #     gh attestation verify dlss5-autopilot.exe --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/dlss5-autopilot.exe
            DLSS5-Autopilot-v${{ env.VERSION }}-win64.zip

      # Creates the release if the tag was pushed without one, so a plain
      # `git push --tags` is enough to publish.
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="DLSS5-Autopilot-v${VERSION}-win64.zip"
          # The notes live in docs/releases/<tag>.md; the old flat
          # release-notes-<tag>.md is still accepted so re-running an older
          # tag's workflow keeps working.
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="release-notes-${TAG}.md"
          TITLE="DLSS 5 Autopilot ${TAG}"
          # The notes are the notes file, nothing else. The hashes travel as
          # SHA256SUMS.txt beside the build (the self-updater reads it) and the
          # provenance attestation is on the commit - no essay on the page.
          if [ -f "$NOTES" ]; then cp "$NOTES" FULL-NOTES.md; else echo "See the commit history for what changed." > FULL-NOTES.md; fi
          # A release whose tag was re-pushed comes back as a DRAFT and is
          # invisible to everyone; publish it explicitly and mark it latest.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file FULL-NOTES.md --draft=false --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file FULL-NOTES.md --latest
          fi
          gh release upload "$TAG" "$ZIP" "SHA256SUMS.txt" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: dlss5-autopilot-${{ env.VERSION }}
          path: |
            DLSS5-Autopilot-v${{ env.VERSION }}-win64.zip
            SHA256SUMS.txt
