# Adds up every shared result into docs/compatibility.json, which the tool
# downloads before an install to say what other people found in this game.
#
# There is no server behind this and there never will be. A person presses
# "it worked" / "it did not" in the tool; that opens an issue in their own
# browser, carrying one machine-readable block and nothing that identifies
# them - executable name, route, build, API, card architecture, driver, the
# tool's version, and the outcome. This workflow reads those blocks off every
# issue that carries one, labelled or not, and writes the totals into one
# static file.
#
# Only the block is read. The prose around it is for people; if somebody
# edits the JSON by hand into something that is not a record, `parse()`
# drops it rather than guessing.
#
# A result that has been read is then labelled `result` and closed, with a
# short note saying where it went. It is data, not a bug report, and left
# open it buried the reports that do need someone - sixteen of them arrived
# in the first four hours of 1.8.0. Closed results are still counted: the
# build below reads state=all. Nothing else is written, and only issues
# whose body parses as a record are touched.
#
# The same run also writes the list as a page people can search, one row
# per card, driver and build (#304), and publishes it with GitHub Pages
# (Settings > Pages > Source: GitHub Actions). The page is built in the
# runner and never committed; until Pages is switched on the publish step
# fails on its own and the list is still rebuilt.
name: compatibility

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  schedule:
    - cron: "17 4 * * *"        # a daily rebuild, so a deleted issue drops out
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # Its own job and its own concurrency group: the build below cancels a
  # run in progress when the next result lands, and a burst of results
  # would otherwise leave some of them open for good.
  file:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    concurrency:
      group: file-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this a shared result?
        id: check
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from core.community import parse
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf8"))
          body = (event.get("issue") or {}).get("body") or ""
          rec = parse(body)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as out:
              out.write(f"record={'yes' if rec else 'no'}\n")
          PY

      - name: Label it, say where it went, and close it
        if: steps.check.outputs.record == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create result --repo "$REPO" --color 0E8A16 \
            --description "a shared compatibility result, read into docs/compatibility.json" \
            2>/dev/null || true
          gh issue edit "$NUMBER" --repo "$REPO" --add-label result || true
          gh issue close "$NUMBER" --repo "$REPO" --reason completed --comment \
          "Thank you - this result goes into [the compatibility list](https://github.com/$REPO/blob/main/docs/compatibility.json). Once a game has five results, the tool tells anyone who picks that game in it which route worked most often and whether the one they picked did worse, before they install. Three results on the same route that worked and carried a measurement also tell them what those sessions ran at - the work area, the frame rate, and the milliseconds a frame spent on what grows with that area - the model on its own, or the model and the feed together on the feeder.

          Closed because it is a record rather than a bug report, so the issue list keeps showing the things that still need someone. It still counts. If you want to add what you saw - a setting that changed it, a driver that fixed it - reply here."

  build:
    runs-on: ubuntu-latest
    # Only the rebuild: two of them at once would race on the same commit,
    # and the newest one has read every issue anyway. The `file` job above
    # must never be cancelled, or a result it was about to close stays open.
    concurrency:
      group: compatibility
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read every result issue and add them up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGE_DIR: _site
        run: python .github/scripts/compatibility.py

      - name: Hand the page to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # main moves under a running build - a release push, or the bot's own
      # commit from the run before - and a plain push was rejected ("fetch
      # first"), failing the run (2026-09-30). On a rejection: take the new
      # main, rebuild the file on top of it (it is generated, so never
      # merged), and push again.
      - name: Commit the file if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGE_DIR: _site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- docs/compatibility.json; then
              echo "nothing changed"
              exit 0
            fi
            git add docs/compatibility.json
            git commit -q -m "compatibility: rebuild from the shared results"
            if git push; then
              exit 0
            fi
            echo "main moved - rebuilding on top of it (attempt $attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python .github/scripts/compatibility.py
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts"
          exit 1

  pages:
    needs: build
    runs-on: ubuntu-latest
    # Pages is switched on by the repository owner, not by this file. Until
    # then this job fails, and it must not turn every result's run red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Publish the page
        id: deployment
        uses: actions/deploy-pages@v4
